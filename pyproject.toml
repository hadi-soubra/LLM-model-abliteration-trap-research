[project]
name = "abliteration-defense"
version = "0.1.0"
description = "COE749: defending open-weight LLMs against abliteration"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=4.46", "accelerate", "pyyaml"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
