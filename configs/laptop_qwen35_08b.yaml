# Settings for running on the laptop (RTX 3050, 6 GB of GPU memory).
model: Qwen/Qwen3.5-0.8B
device: cuda          # "cuda" = the GPU; use "cpu" if there is no GPU
dtype: bfloat16       # number format for the weights: half the memory of float32
min_gpu_gb: 4         # the preflight check warns below this
seed: 0               # fixes which prompts get picked, so every run picks the same ones
batch_size: 32        # how many prompts go through the model at once

prompts:
  n_harmful: 128      # harmful requests (AdvBench) used to find the refusal direction
  n_harmless: 128     # harmless requests (Alpaca) used to find the refusal direction
  n_watch: 10         # extra harmful requests, only used to read the model's answers before and after
  n_check: 32         # new harmful AND new harmless requests, only used to score the candidate arrows (step 4)
  n_harmless_eval: 100  # new harmless requests for the ruler: how often the judge raises false alarms

choose:                 # step 4: rules for choosing the best arrow
  max_side_effect: 0.1  # how much removing an arrow may change harmless first-word probabilities (KL); Arditi uses 0.1

decoding:               # how answers are generated in the measurements (Experiment 2 on)
  repetition_penalty: 1.05   # Qwen's own small penalty against loops; the same for every model and attack
  max_new_tokens: 256
  gsm8k_max_new_tokens: 512  # math answers need room for the working

eval:                   # the ruler; night1_baseline.py --quick cuts every set to 4 questions
  batch_size: 16
  n_harmful: 200        # HarmBench
  n_harmless: 100       # Alpaca (the harmless_eval group)
  n_xstest: 250         # XSTest safe questions
  n_gsm8k: 1319         # GSM8K test problems

judge:
  name: meta-llama/Llama-Guard-3-1B   # the 8B does not fit in 6 GB
  batch_size: 8
